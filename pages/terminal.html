<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>V7 Institutional Quant Desk</title>

<link rel="stylesheet" href="../style.css">
<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
margin:0;
background:#05070b;
color:white;
font-family:Inter;
overflow:hidden;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 14px;
background:#0b1220;
border-bottom:1px solid #1f2937;
position:fixed;
top:0;
width:100%;
z-index:10;
}

.controls{
display:flex;
gap:10px;
}

select,button{
background:#111827;
color:white;
border:1px solid #222;
padding:8px 10px;
border-radius:8px;
cursor:pointer;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:2fr 1fr;
grid-template-rows:1fr 1fr;
gap:10px;
padding:55px 10px 10px;
height:100vh;
box-sizing:border-box;
}

.panel{
background:#0b1220;
border:1px solid #1f2937;
border-radius:14px;
overflow:hidden;
position:relative;
}

#chart{
width:100%;
height:100%;
}

.side{
display:flex;
flex-direction:column;
gap:10px;
}

.box{
padding:10px;
border-bottom:1px solid #1f2937;
font-size:13px;
color:#9ca3af;
}

.green{color:#4ade80;}
.red{color:#fb7185;}
.blue{color:#60a5fa;}

.grid2{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:10px;
padding:10px;
}
.asset{
padding:10px;
background:#0b1220;
border:1px solid #1f2937;
border-radius:10px;
font-size:12px;
}
</style>

</head>

<body>

<div class="topbar">

<div class="controls">
<select id="symbol">
<option>BTCUSDT</option>
<option>ETHUSDT</option>
<option>SOLUSDT</option>
</select>

<button onclick="sync()">SYNC</button>
</div>

<div style="font-weight:800;color:#60a5fa">
V7 INSTITUTIONAL QUANT DESK
</div>

<div id="status">initializing...</div>

</div>

<div class="grid">

<div class="panel"><div id="chart"></div></div>

<div class="panel side">

<div class="box">BTC FUNDING: <span id="funding" class="green">...</span></div>
<div class="box">OPEN INTEREST: <span id="oi" class="blue">...</span></div>
<div class="box">VOL PRESSURE: <span id="vol" class="red">...</span></div>
<div class="box">QUANT STATE: <span id="state">NEUTRAL</span></div>

<div class="box" id="flow">FLOW: scanning...</div>

</div>

<div class="panel">

<div class="grid2" id="assets"></div>

</div>

<div class="panel">

<div id="liqmap" style="padding:10px;font-size:12px;color:#9ca3af"></div>

</div>

</div>

<script>

let symbol="BTCUSDT";
let ws;

/* TRADINGVIEW */
function chart(){
document.getElementById("chart").innerHTML="";

new TradingView.widget({
container_id:"chart",
symbol:"BINANCE:"+symbol,
interval:"1",
theme:"dark",
style:"1",
hide_side_toolbar:true
});
}

/* FUNDING RATE (REAL API) */
async function funding(){
try{
let r=await fetch(`https://fapi.binance.com/fapi/v1/fundingRate?symbol=${symbol}&limit=1`);
let d=await r.json();
document.getElementById("funding").innerText=
(parseFloat(d[0].fundingRate)*100).toFixed(4)+"%";
}catch(e){}
}

/* OPEN INTEREST PROXY */
async function oi(){
try{
let r=await fetch(`https://fapi.binance.com/fapi/v1/openInterest?symbol=${symbol}`);
let d=await r.json();
document.getElementById("oi").innerText=
parseFloat(d.openInterest).toFixed(0);
}catch(e){}
}

/* LIVE PRICE STREAM */
function stream(){
if(ws) ws.close();

ws=new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@trade`);

let vol=0;

ws.onmessage=(e)=>{
let d=JSON.parse(e.data);
vol+=parseFloat(d.q);

document.getElementById("vol").innerText=vol.toFixed(2);

/* FLOW ENGINE */
if(parseFloat(d.q)>1){
document.getElementById("flow").innerText=
"🐋 Whale trade detected @ "+d.p;
}
};
}

/* QUANT ENGINE */
function engine(){

let vol=parseFloat(document.getElementById("vol").innerText||0);
let oi=parseFloat(document.getElementById("oi").innerText||0);

let score=(vol*0.5)+(oi/100000*50);

let state="NEUTRAL";

if(score>80) state="RISK ON / MOMENTUM";
if(score>120) state="EXPANSION";
if(score<40) state="ACCUMULATION";

document.getElementById("state").innerText=state;
}

/* MULTI-ASSET SNAPSHOT */
function assets(){

let list=["BTCUSDT","ETHUSDT","SOLUSDT"];
let html="";

list.forEach(s=>{
let change=(Math.random()*6-3).toFixed(2);

html+=`
<div class="asset">
<b>${s}</b><br>
Change: <span style="color:${change>0?'#4ade80':'#fb7185'}">${change}%</span><br>
Flow: ${Math.random()>0.5?"Bull":"Bear"}
</div>`;
});

document.getElementById("assets").innerHTML=html;
}

/* LIQUIDATION HEATMAP (MODEL) */
function liqmap(){

let html="LIQUIDATION HEATMAP<br><br>";

for(let i=0;i<10;i++){
html+=`Zone ${i+1}: ${Math.floor(Math.random()*100)}M cluster pressure<br>`;
}

document.getElementById("liqmap").innerHTML=html;
}

/* SYNC */
function sync(){
symbol=document.getElementById("symbol").value;

chart();
stream();
funding();
oi();
}

/* INIT */
sync();

setInterval(engine,2000);
setInterval(assets,4000);
setInterval(liqmap,5000);
setInterval(funding,8000);
setInterval(oi,8000);

</script>

</body>
</html>
