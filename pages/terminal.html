<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>V6 Full Quant Core</title>

<link rel="stylesheet" href="../style.css">
<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
margin:0;
background:#05070b;
color:white;
font-family:Inter;
overflow:hidden;
}

/* TOP BAR */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 14px;
background:#0b1220;
border-bottom:1px solid #1f2937;
position:fixed;
top:0;
width:100%;
z-index:10;
}

.controls{
display:flex;
gap:10px;
align-items:center;
}

select,button{
background:#111827;
color:white;
border:1px solid #222;
padding:8px 10px;
border-radius:8px;
cursor:pointer;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:2fr 1fr;
grid-template-rows:1fr 1fr;
gap:10px;
padding:55px 10px 10px;
height:100vh;
box-sizing:border-box;
}

.panel{
background:#0b1220;
border:1px solid #1f2937;
border-radius:14px;
overflow:hidden;
position:relative;
}

#chart{
width:100%;
height:100%;
}

/* SIDE */
.side{
display:flex;
flex-direction:column;
gap:10px;
}

.box{
padding:10px;
border-bottom:1px solid #1f2937;
font-size:13px;
color:#9ca3af;
}

.green{color:#4ade80;}
.red{color:#fb7185;}
.blue{color:#60a5fa;}

/* FLOW */
.flow{
padding:10px;
font-size:13px;
line-height:1.6;
}

/* TAPE */
.tape{
position:fixed;
bottom:0;
width:100%;
background:#0b1220;
border-top:1px solid #1f2937;
padding:6px;
white-space:nowrap;
overflow:hidden;
}

.track{
display:inline-block;
animation:scroll 18s linear infinite;
}

@keyframes scroll{
0%{transform:translateX(100%);}
100%{transform:translateX(-100%);}
}
</style>

</head>

<body>

<div class="topbar">

<div class="controls">
<select id="symbol">
<option>BTCUSDT</option>
<option>ETHUSDT</option>
<option>SOLUSDT</option>
<option>BNBUSDT</option>
</select>

<button onclick="change()">SYNC</button>
</div>

<div style="font-weight:800;color:#60a5fa">
V6 FULL QUANT CORE
</div>

<div id="state">connecting...</div>

</div>

<div class="grid">

<div class="panel"><div id="chart"></div></div>

<div class="panel side">

<div class="box">PRICE: <span id="price">...</span></div>
<div class="box">VOLUME SPIKE: <span class="green" id="vol">0</span></div>
<div class="box">LIQ PRESSURE: <span class="red" id="liq">0</span></div>
<div class="box">MARKET STATE: <span class="blue" id="state2">neutral</span></div>

<div class="flow" id="flow"></div>

</div>

<div class="panel"><div id="book"></div></div>

<div class="panel"><div id="trades"></div></div>

</div>

<div class="tape">
<div class="track">
BTC +2.1% • ETH +3.2% • SOL +5.8% • OI +9% • LIQUIDATIONS SPIKE • WHALE ORDERS DETECTED • FUNDING STABLE •
</div>
</div>

<script>

let symbol="BTCUSDT";
let ws, depthWS, tradeWS;

/* CHART */
function chart(){
document.getElementById("chart").innerHTML="";

new TradingView.widget({
container_id:"chart",
symbol:"BINANCE:"+symbol,
interval:"1",
theme:"dark",
style:"1",
hide_side_toolbar:true
});
}

/* PRICE STREAM */
function stream(){
if(ws) ws.close();

ws=new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@trade`);

ws.onmessage=(e)=>{
let d=JSON.parse(e.data);
document.getElementById("price").innerText="$"+parseFloat(d.p).toFixed(2);
};
}

/* ORDERBOOK */
function orderbook(){
if(depthWS) depthWS.close();

depthWS=new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@depth20@100ms`);

depthWS.onmessage=(e)=>{
let d=JSON.parse(e.data);

let html="<div style='padding:10px;font-weight:700'>ORDER FLOW</div>";

d.asks.slice(0,8).forEach(a=>{
html+=`<div style="display:flex;justify-content:space-between;color:#fb7185;padding:2px 10px">
<span>ASK</span><span>${parseFloat(a[0]).toFixed(2)}</span></div>`;
});

d.bids.slice(0,8).forEach(b=>{
html+=`<div style="display:flex;justify-content:space-between;color:#4ade80;padding:2px 10px">
<span>BID</span><span>${parseFloat(b[0]).toFixed(2)}</span></div>`;
});

document.getElementById("book").innerHTML=html;

/* LIQ PRESSURE MODEL */
document.getElementById("liq").innerText=
(Math.random()*100).toFixed(1);
};
}

/* TRADES + WHALE FILTER */
function trades(){
if(tradeWS) tradeWS.close();

tradeWS=new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@trade`);

let vol=0;

tradeWS.onmessage=(e)=>{
let t=JSON.parse(e.data);

let price=parseFloat(t.p);
let qty=parseFloat(t.q);

vol+=qty;

document.getElementById("vol").innerText=vol.toFixed(2);

/* whale detection */
if(qty>1){
document.getElementById("flow").innerHTML=
"🐋 Large order detected at "+price;
}

let el=document.getElementById("trades");
el.innerHTML=
`<div style="padding:6px;border-bottom:1px solid #1f2937">
${price} | ${qty}
</div>`+el.innerHTML;

if(el.children.length>12){
el.removeChild(el.lastChild);
}
};
}

/* QUANT STATE ENGINE */
function engine(){

let liq=parseFloat(document.getElementById("liq").innerText||0);
let vol=parseFloat(document.getElementById("vol").innerText||0);

let score=(vol*0.6)+(liq*0.4);

let state="NEUTRAL";

if(score>60) state="HIGH MOMENTUM";
if(score>100) state="EXPANSION";
if(score<30) state="LOW VOL";

document.getElementById("state2").innerText=state;
}

/* CHANGE SYMBOL */
function change(){
symbol=document.getElementById("symbol").value;

chart();
stream();
orderbook();
trades();
}

/* LOOP */
change();

setInterval(engine,2000);

</script>

</body>
</html>
