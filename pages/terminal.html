<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>V4 Ultra Desk</title>

<link rel="stylesheet" href="../style.css">
<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
margin:0;
background:#05070b;
color:white;
font-family:Inter;
overflow:hidden;
}

/* TOP BAR */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 14px;
background:#0b1220;
border-bottom:1px solid #1f2937;
position:fixed;
top:0;
width:100%;
z-index:20;
}

.controls{
display:flex;
gap:10px;
align-items:center;
}

select,button{
background:#111827;
color:white;
border:1px solid #222;
padding:8px 10px;
border-radius:8px;
cursor:pointer;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:2fr 1fr;
grid-template-rows:1fr 1fr;
gap:10px;
padding:55px 10px 10px;
height:100vh;
box-sizing:border-box;
}

.panel{
background:#0b1220;
border:1px solid #1f2937;
border-radius:14px;
overflow:hidden;
position:relative;
}

#chart{
width:100%;
height:100%;
}

/* SIDE */
.side{
display:flex;
flex-direction:column;
gap:10px;
}

.box{
padding:10px;
border-bottom:1px solid #1f2937;
font-size:13px;
color:#9ca3af;
}

.green{color:#4ade80;}
.red{color:#fb7185;}
.blue{color:#60a5fa;}

/* ORDERBOOK */
.orderbook{
padding:10px;
font-size:12px;
overflow:auto;
height:100%;
}

.row{
display:flex;
justify-content:space-between;
padding:2px 0;
}

.bid{color:#4ade80;}
.ask{color:#fb7185;}
</style>

</head>

<body>

<div class="topbar">

<div class="controls">
<select id="symbol">
<option>BTCUSDT</option>
<option>ETHUSDT</option>
<option>SOLUSDT</option>
<option>BNBUSDT</option>
</select>

<button onclick="changeSymbol()">SYNC</button>
</div>

<div style="font-weight:800;color:#60a5fa">
V4 ULTRA DESK (LIVE)
</div>

<div id="status">connecting...</div>

</div>

<div class="grid">

<div class="panel"><div id="chart"></div></div>

<div class="panel side">

<div class="box">PRICE: <span id="price">...</span></div>
<div class="box">24h VOL: <span id="vol">loading...</span></div>
<div class="box">ORDER FLOW: <span class="green">LIVE</span></div>
<div class="box">LIQ ZONE: <span class="red">ACTIVE</span></div>

<div class="orderbook" id="book"></div>

</div>

<div class="panel"><div id="trades"></div></div>

<div class="panel"><div id="liquidations"></div></div>

</div>

<script src="https://unpkg.com/ccxt@4.2.85/dist/ccxt.browser.min.js"></script>

<script>
let symbol="BTCUSDT";
let ws;
let bookData=[];

/* TRADINGVIEW */
function loadChart(){
document.getElementById("chart").innerHTML="";

new TradingView.widget({
container_id:"chart",
symbol:"BINANCE:"+symbol,
interval:"1",
theme:"dark",
style:"1",
hide_side_toolbar:true,
allow_symbol_change:false
});
}

/* BINANCE WEBSOCKET (REAL PRICE STREAM) */
function connectWS(){

if(ws) ws.close();

ws=new WebSocket(
`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@trade`
);

ws.onopen=()=>{
document.getElementById("status").innerText="LIVE";
};

ws.onmessage=(event)=>{
let data=JSON.parse(event.data);
document.getElementById("price").innerText=parseFloat(data.p).toFixed(2);
};
}

/* ORDERBOOK (DEPTH STREAM) */
let depthWS;

function orderbook(){
if(depthWS) depthWS.close();

depthWS=new WebSocket(
`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@depth20@100ms`
);

depthWS.onmessage=(e)=>{
let d=JSON.parse(e.data);

let html="";

/* ASKS */
d.asks.slice(0,10).forEach(a=>{
html+=`<div class="row ask"><span>SELL</span><span>${parseFloat(a[0]).toFixed(2)}</span></div>`;
});

/* BIDS */
d.bids.slice(0,10).forEach(b=>{
html+=`<div class="row bid"><span>BUY</span><span>${parseFloat(b[0]).toFixed(2)}</span></div>`;
});

document.getElementById("book").innerHTML=html;
};
}

/* LIVE TRADES TAPE */
let tradeWS;

function trades(){
if(tradeWS) tradeWS.close();

tradeWS=new WebSocket(
`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@trade`
);

tradeWS.onmessage=(e)=>{
let t=JSON.parse(e.data);

let el=document.getElementById("trades");
el.innerHTML=
`<div style="padding:10px;border-bottom:1px solid #1f2937">
TRADE: ${parseFloat(t.p).toFixed(2)} | QTY: ${t.q}
</div>` + el.innerHTML;

if(el.children.length>15){
el.removeChild(el.lastChild);
}
};
}

/* CHANGE SYMBOL */
function changeSymbol(){
symbol=document.getElementById("symbol").value;

loadChart();
connectWS();
orderbook();
trades();
}

/* INIT */
changeSymbol();

</script>

</body>
</html>
